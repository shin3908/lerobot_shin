# Complete training configuration for Pi0 fine-tuning (original episodes dataset)
# This replaces the original Pi0 fine-tuning command with YAML configuration

# Policy configuration
policy:
  path: "lerobot/pi0"
  device: "cuda"

# Dataset configuration
dataset:
  repo_id: "shin1107/koch_base_episodes"

# Training parameters
batch_size: 8
steps: 200000

# Output settings
output_dir: "data3/train/koch_base_pi0_pretrained"
job_name: "act_koch_base_pi0"

# Weights & Biases logging
wandb:
  enable: true
  project: "lerobotpi_base_pretrained"

# Checkpointing and evaluation
save_freq: 10000
eval_freq: 10000
log_freq: 100
