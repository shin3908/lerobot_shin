# PI0 Configuration with Advanced Dimension Compression
# This configuration demonstrates the use of advanced compression methods
# for PI0 models with different observation dimensions

# Base configuration
policy:
  type: pi0
  
  # Observation filtering - specify which features to include
  observation_state_filter:
    - "pos"  # Include all position features
    # - "current"  # Uncomment to also include current features
  
  # Advanced dimension compression settings
  dimension_compression_method: "auto"
  enable_dimension_compression: true
  
  # Standard PI0 settings
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  max_state_dim: 32
  max_action_dim: 32
  
  # Training settings
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true

# Dataset configuration
dataset:
  repo_id: "shin1107/koch_new_fb"
  
# Training configuration
steps: 200000
batch_size: 64
save_freq: 10000
eval_freq: 10000
log_freq: 100

# Optimizer settings
optimizer:
  lr: 1e-4
  weight_decay: 1e-10
  
# Scheduler settings
scheduler:
  warmup_steps: 1000
  decay_steps: 30000
