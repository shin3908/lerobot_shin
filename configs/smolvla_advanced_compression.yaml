# SmolVLA Configuration with Advanced Dimension Compression
# This configuration demonstrates the use of advanced compression methods
# for handling different observation dimensions between datasets and pretrained models

# Base configuration
policy:
  type: smolvla
  
  # Observation filtering - specify which features to include
  # This allows you to train on specific subsets of observation data
  observation_state_filter:
    - "pos"  # Include all position features
    # - "current"  # Uncomment to also include current features
    # - "shoulder_pan.pos"  # Example of specific joint selection
    # - "gripper.pos"  # Example of specific gripper position
  
  # Advanced dimension compression settings
  # These settings control how observation dimensions are compressed
  # when loading pretrained models with different expected dimensions
  
  # Compression method options:
  # - "auto": Automatically select the best method based on dimensions
  # - "position_selection": Use position features for 12D->6D compression
  # - "weighted_groups": Use weighted averaging for moderate compression
  # - "pca": Use Principal Component Analysis for maximum information preservation
  # - "uniform_sampling": Use uniform sampling as fallback
  dimension_compression_method: "auto"
  
  # Enable/disable dimension compression
  enable_dimension_compression: true
  
  # Standard SmolVLA settings
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  max_state_dim: 32
  max_action_dim: 32
  
  # Training settings
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true

# Dataset configuration
dataset:
  # Your dataset repo_id here
  repo_id: "shin1107/koch_new_fb"
  
# Training configuration
steps: 200000
batch_size: 64
save_freq: 10000
eval_freq: 10000
log_freq: 100

# Optimizer settings
optimizer:
  lr: 1e-4
  weight_decay: 1e-10
  
# Scheduler settings
scheduler:
  warmup_steps: 1000
  decay_steps: 30000
